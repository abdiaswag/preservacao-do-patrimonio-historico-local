<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preservação do Patrimônio Histórico Local - PI Parnamirim</title>
  <link rel="stylesheet" href="../../static/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
  <header class="cabecalho">

    <nav class="navbar navbar-expand-lg navbarp">
      <div class="container">

        <a class="navbar-brand logo-navbar" href="/">
          Potibala's
        </a>

        <button 
          class="navbar-toggler" 
          type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" 
          aria-expanded="false" 
          aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse ms-auto" id="navbarSupportedContent">

          <ul class="navbar-nav mb-2 mb-lg-0 ms-auto">

            <li class="nav-item">
              <a class="nav-link" href="/">Início</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#patrimonios">Patrimônios</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/quiz">Quiz</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#sobre">Sobre o projeto</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="/login">Entrar</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="/usuarios/criar">Criar Conta</a>
            </li>

          </ul>

        </div>
      </div>
    </nav>

    <main class="container py-5"> 
        <div class="col-md-8 mx-auto"> 
            <h1 class="mb-4">Editar usuário</h1> 
            <form method="POST" action="{{ url_for('main.editar_usuario', id=usuario.id) }}"> 
                <div class="mb-3"> 
                    <label class="form-label">Nome</label> 
                    <input type="text" name="nome" class="form-control" value="{{ usuario.nome }}" required> 
                </div> 

                <div class="mb-3"> 
                    <label class="form-label">E-mail</label> 
                    <input type="email" name="email" class="form-control" value="{{ usuario.email }}" required> 
                </div> 

                <div class="mb-3"> 
                    <label class="form-label">Nova senha</label> 
                    <input type="password" name="senha" class="form-control" placeholder="Deixe vazio para manter a senha atual"> 
                </div> 

                <div class="mb-3"> 
                    <label class="form-label">Tipo de usuário</label> 
                    <select name="tipo" class="form-select"> 
                        <option value="usuario" {% if usuario.tipo == "usuario" %}selected{% endif %}>Usuário</option> 
                        <option value="admin" {% if usuario.tipo == "admin" %}selected{% endif %}>Administrador</option> 
                    </select> 
                </div> 

                <button type="submit" class="btn btn-warning">Salvar alterações</button> 

                <a href="{{ url_for('main.listar_usuarios') }}" class="btn btn-secondary">Cancelar</a> 

            </form> 
        </div> 
    </main>
    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
