<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Potibala's</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

    <nav class="navbar navbar-expand-lg navbarp">
      <div class="container">

        <a class="navbar-brand logo-navbar" href="/">
          Potibala's
        </a>

        <button 
          class="navbar-toggler" 
          type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" 
          aria-expanded="false" 
          aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse ms-auto" id="navbarSupportedContent">

          <ul class="navbar-nav mb-2 mb-lg-0 ms-auto">

            <li class="nav-item">
              <a class="nav-link active" href="/">Início</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#patrimonios">Patrimônios</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/quiz">Quiz</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#sobre">Sobre o projeto</a>
            </li>

          </ul>

        </div>
      </div>
    </nav>


    <div class="hero">

      <div class="hero-conteudo">

        <span class="hero-tag">PATRIMÔNIO • HISTÓRIA • CULTURA</span>

        <h1>
          Preservação do Patrimônio
          <br>
          Histórico de Parnamirim
        </h1>

        

      </div>

    </div>



    <!-- CONTEÚDO DO QUIZ -->
    <main class="container py-5">

        <h1 class="text-center">
            Quiz
        </h1>

        <p class="text-center">
            Teste seus conhecimentos sobre o patrimônio do Rio Grande do Norte.
        </p>

        <div class="card mx-auto" style="max-width: 700px;">
            <div class="card-body">

                <h3 class="mb-4">
                    1. Pergunta do quiz
                </h3>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="pergunta1" id="opcao1">
                    <label class="form-check-label" for="opcao1">
                        Opção 1
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="pergunta1" id="opcao2">
                    <label class="form-check-label" for="opcao2">
                        Opção 2
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="pergunta1" id="opcao3">
                    <label class="form-check-label" for="opcao3">
                        Opção 3
                    </label>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="radio" name="pergunta1" id="opcao4">
                    <label class="form-check-label" for="opcao4">
                        Opção 4
                    </label>
                </div>

                <button class="btn btn-primary w-100">
                    Responder
                </button>

            </div>
        </div>


    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
