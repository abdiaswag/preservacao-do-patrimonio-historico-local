<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar matéria - Potibala's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>


<body>

    <nav class="navbar navbar-expand-lg navbarp">
      <div class="container">

        <a class="navbar-brand logo-navbar" href="/">
          Potibala's
        </a>

        <button 
          class="navbar-toggler" 
          type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" 
          aria-expanded="false" 
          aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse ms-auto" id="navbarSupportedContent">

          <ul class="navbar-nav mb-2 mb-lg-0 ms-auto">

            <li class="nav-item">
              <a class="nav-link active" href="/">Início</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#patrimonios">Patrimônios</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/quiz">Quiz</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/materias">Matérias</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#sobre">Sobre o projeto</a>
            </li>

          </ul>

        </div>
      </div>
    </nav>


    <main class="container py-5">

        <div class="col-md-8 mx-auto">

            <h1 class="mb-4">
                Editar matéria
            </h1>


            <form 
                action="{{ url_for('main.editar_materia', id=materia.id) }}"
                method="POST">


                <div class="mb-3">

                    <label class="form-label">
                        Título
                    </label>

                    <input 
                        type="text"
                        name="titulo"
                        class="form-control"
                        value="{{ materia.titulo }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Categoria
                    </label>

                    <input 
                        type="text"
                        name="categoria"
                        class="form-control"
                        value="{{ materia.categoria }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Nome da imagem
                    </label>

                    <input type="file" class="form-control" name="imagem" accept="image/*">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Texto
                    </label>

                    <textarea 
                        name="texto"
                        class="form-control"
                        rows="8"
                        required>{{ materia.texto }}</textarea>

                </div>


                <button 
                    type="submit"
                    class="btn btn-warning">

                    Salvar alterações

                </button>


                <a 
                    href="{{ url_for('main.listar_materias') }}"
                    class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>
