<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ materia.titulo }} - Potibala's</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbarp">

        <div class="container">

            <a class="navbar-brand logo-navbar" href="/">
                Potibala's
            </a>

            <div>
                <a class="nav-link d-inline-block" href="/">
                    Início
                </a>

                <a class="nav-link d-inline-block" href="/#patrimonios">
                    Patrimônios
                </a>
            </div>

        </div>

    </nav>


    <main class="pagina-materia">

        <div class="container">

            <span class="categoria">
                {{ materia.categoria }}
            </span>

            <h1 class="titulo-materia">
                {{ materia.titulo }}
            </h1>

            {% if materia.imagem %}
                <img
                    src="{{ url_for('static', filename='uploads/' + materia.imagem) }}"
                    alt="{{ materia.titulo }}"
                >
            {% endif %}

            <div class="texto-materia">

                <p>
                    {{ materia.texto }}
                </p>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


</body>

</html>
